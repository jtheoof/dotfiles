<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Segoe UI Variable</family><family>Segoe UI</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>CaskaydiaCove Nerd Font</family><family>Cascadia Code</family></prefer></alias>
  <!-- Windows-style emoji (Segoe UI Emoji), falling back to Noto Color Emoji -->
  <alias binding="same"><family>emoji</family><prefer><family>Segoe UI Emoji</family></prefer></alias>
  <!-- Windows-like rendering: light hinting + subpixel (ClearType-ish) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
