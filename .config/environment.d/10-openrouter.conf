# Claude Code via OpenRouter. The key itself lives in 05-secrets.local.conf (gitignored).
# Comments must be on their own line: a trailing "# ..." becomes part of the value.
ANTHROPIC_BASE_URL="https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY"
# ANTHROPIC_API_KEY must not hold a real Anthropic key. environment.d cannot set an
# empty value, so it is left unset here, which has the same effect.
CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1
